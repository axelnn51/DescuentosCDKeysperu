version: '3.8'

services:
  spy-rebajas:
    build: .
    container_name: spy_rebajas_peru
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Lima
    volumes:
      # Persistencia de la base de datos de ofertas vistas
      - ./data:/app/data

